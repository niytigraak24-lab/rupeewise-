<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>RupeeWise – Your Personal Financial Survival Assistant</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--sf:#e9edf7;--ac:#0b8a66;--ac2:#4b57e0;--tx:#12182b;--mu:#566177;--wa:#a35f00;--er:#c92a47;--bd:#d9dfec;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1020;--card:#141B2D;--sf:#1B2540;--ac:#38D9A9;--ac2:#7C8CFF;--tx:#F5F7FF;--mu:#A6B0C3;--wa:#FFBF69;--er:#FF6B81;--bd:#26304d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1020;--card:#141B2D;--sf:#1B2540;--ac:#38D9A9;--ac2:#7C8CFF;--tx:#F5F7FF;--mu:#A6B0C3;--wa:#FFBF69;--er:#FF6B81;--bd:#26304d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Inter,system-ui,sans-serif}
a{color:inherit;text-decoration:none}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:6px;align-items:center;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--bd);overflow-x:auto}
nav b{color:var(--ac);margin-right:10px;white-space:nowrap;font-size:18px}nav a{padding:7px 12px;border-radius:10px;color:var(--mu);white-space:nowrap}nav a.on,nav a:hover{background:var(--sf);color:var(--tx)}
main{max-width:1050px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin-bottom:16px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.mu{color:var(--mu)}.big{font-size:26px;font-weight:700}.ac{color:var(--ac)}.wa{color:var(--wa)}.er{color:var(--er)}
h1{font-size:clamp(32px,6vw,54px);line-height:1.1;margin:10px 0}h2{margin:0 0 10px;font-size:20px}h3{margin:0 0 8px;font-size:16px}
.btn{display:inline-block;background:var(--ac);color:#06241b;border:0;padding:10px 18px;border-radius:12px;font:600 15px inherit;cursor:pointer}.btn.s{background:var(--sf);color:var(--tx);border:1px solid var(--bd)}.btn.sm{padding:5px 10px;font-size:13px}
input,select{background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:9px 11px;font:inherit;width:100%}
label{display:block;font-size:13px;color:var(--mu)}form{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));align-items:end}
.bar{height:10px;background:var(--sf);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);border-radius:9px;transition:width .5s}
.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd);align-items:center}.row:last-child{border:0}
.al{padding:10px 12px;border-radius:10px;background:var(--sf);margin-bottom:8px;border-left:4px solid var(--ac2)}.al.w{border-color:var(--wa)}.al.e{border-color:var(--er)}
.tag{font-size:11px;background:var(--sf);padding:2px 8px;border-radius:9px;color:var(--mu)}
.hero{padding:30px 0;text-align:center}.hero p{max-width:620px;margin:0 auto 20px;color:var(--mu);font-size:17px}
details{padding:10px 0;border-bottom:1px solid var(--bd)}summary{cursor:pointer;font-weight:600}
.chat{max-height:340px;overflow:auto;display:grid;gap:8px;margin-bottom:10px}.m{padding:9px 12px;border-radius:12px;background:var(--sf);max-width:85%}.m.u{background:var(--ac2);color:#fff;justify-self:end}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:12px;display:none;z-index:9}
.tw{overflow-x:auto}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:8}
</style></head><body>
<canvas id="fx" aria-hidden="true"></canvas><nav id="nav"></nav><main id="app"></main><div id="toast"></div>
<script>
const CATS=['Food','Groceries','Transport','Education','Shopping','Entertainment','Hostel and rent','Bills','Healthcare','Other'],INC=['Pocket money','Salary','Scholarship','Freelance income','Gift','Other'],COL=['#38D9A9','#7C8CFF','#FFBF69','#FF6B81','#4cc9f0','#f78fb3','#a0e7a0','#c3a6ff','#ffa07a','#8896ab'];
const fresh=()=>({set:false,demo:false,name:'',start:0,budget:0,days:30,tx:[],ess:[],goals:[],cb:{}});
let A;try{A=JSON.parse(localStorage.getItem('rw_accts'))}catch(e){}
A=A&&A.list?A:((()=>{try{return localStorage.getItem('rw')}catch(e){}})()?{cur:'a0',list:[{id:'a0',name:'My account'}]}:{cur:null,list:[]});
const key=()=>A.cur=='a0'?'rw':'rw_'+A.cur,saveA=()=>{try{localStorage.setItem('rw_accts',JSON.stringify(A))}catch(e){}};
let S;try{S=JSON.parse(localStorage.getItem(key()))||fresh()}catch(e){S=fresh()}
S.cb=S.cb||{};
const save=()=>{if(!A.cur)return;try{localStorage.setItem(key(),JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>'₹'+(+n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const today=()=>new Date().toISOString().slice(0,10),id=()=>Math.random().toString(36).slice(2,9);
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2400)}
/* ---- central financial rules ---- */
function calc(){const inc=S.tx.filter(t=>t.type=='income').reduce((a,t)=>a+t.amount,0),exp=S.tx.filter(t=>t.type=='expense').reduce((a,t)=>a+t.amount,0);
const unpaid=S.ess.filter(e=>!e.paid).reduce((a,e)=>a+e.amount,0),avail=S.start+inc-exp,prot=avail-unpaid,days=Math.max(0,S.days|0);
const limit=days>0?Math.max(0,prot)/days:0,elapsed=Math.max(1,30-days),avg=exp/elapsed,proj=avail-avg*days-unpaid;
const cat={};S.tx.filter(t=>t.type=='expense').forEach(t=>cat[t.category]=(cat[t.category]||0)+t.amount);
return{inc,exp,unpaid,avail,prot,days,limit,avg,proj,cat,used:S.budget>0?exp/S.budget*100:0,enough:S.tx.length>=3}}
/* ---- charts ---- */
function donut(cat){const e=Object.entries(cat).sort((a,b)=>b[1]-a[1]),T=e.reduce((a,x)=>a+x[1],0);if(!T)return'<p class="mu">No expenses yet.</p>';let off=0;
const segs=e.map(([k,v],i)=>{const l=v/T*251.3,s=`<circle r="40" cx="60" cy="60" fill="none" stroke="${COL[i%10]}" stroke-width="18" stroke-dasharray="${l} ${251.3-l}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"><title>${esc(k)}: ${fmt(v)}</title></circle>`;off+=l;return s}).join('');
return`<div style="display:flex;gap:16px;flex-wrap:wrap;align-items:center"><svg viewBox="0 0 120 120" width="150" role="img" aria-label="Spending by category">${segs}</svg><div>${e.map(([k,v],i)=>`<div><span style="color:${COL[i%10]}">●</span> ${esc(k)} <b>${fmt(v)}</b> <span class="mu">${Math.round(v/T*100)}%</span></div>`).join('')}</div></div>`}
function bars(){const d=[];for(let i=6;i>=0;i--){const x=new Date(Date.now()-i*864e5).toISOString().slice(0,10);d.push([x.slice(8)+'/'+x.slice(5,7),S.tx.filter(t=>t.type=='expense'&&t.date==x).reduce((a,t)=>a+t.amount,0)])}
const m=Math.max(1,...d.map(x=>x[1]));return`<svg viewBox="0 0 280 130" width="100%" role="img" aria-label="Last 7 days spending">${d.map((x,i)=>{const h=x[1]/m*90;return`<rect x="${i*40+6}" y="${100-h}" width="28" height="${h}" rx="5" fill="var(--ac2)"><title>${x[0]}: ${fmt(x[1])}</title></rect><text x="${i*40+20}" y="118" font-size="9" text-anchor="middle" fill="var(--mu)">${x[0]}</text>`}).join('')}</svg>`}
/* ---- alerts ---- */
function alerts(c){const a=[];if(S.budget>0){if(c.used>=100)a.push(['e',`You have used ${Math.round(c.used)}% of your monthly budget – it is fully spent.`]);else if(c.used>=80)a.push(['w',`You have used ${Math.round(c.used)}% of your monthly budget.`])}
Object.entries(S.cb).forEach(([k,l])=>{if((c.cat[k]||0)>l)a.push(['w',`Your ${k} spending is higher than its planned limit of ${fmt(l)}.`])});if(c.prot<=0&&S.set)a.push(['e','Your protected balance is zero or negative: your balance does not cover upcoming essentials.']);
S.ess.filter(e=>!e.paid).slice(0,2).forEach(e=>a.push(['',`Upcoming essential expense: ${esc(e.title)} – ${fmt(e.amount)}${e.due?' due '+e.due:''}.`]));
if(c.enough&&c.proj<0)a.push(['w',`Estimate: at your current pace you may be short by ${fmt(-c.proj)} before month-end.`]);
S.goals.forEach(g=>{if(g.saved>=g.target)a.push(['','🎉 Goal reached: '+esc(g.title)])});return a.length?a:[['','No alerts right now. Keep tracking!']]}
/* ---- views ---- */
const V={};
V.home=()=>`<section class="hero"><span class="tag">Spend Smarter. Save Better. Live Freely.</span><h1>Make Your Money <span class="ac">Last Longer.</span></h1><p>Your personal financial survival assistant. Track every rupee, plan your spending, and stay financially confident throughout the month.</p><a class="btn" href="#dashboard">Start Managing Money</a> <button class="btn s" onclick="demo()">Explore Demo</button></section>
<div class="grid"><div class="card"><div class="mu">Available balance</div><div class="big">₹7,000.00</div></div><div class="card"><div class="mu">Daily spending limit</div><div class="big ac">₹300.00</div></div><div class="card"><div class="mu">Month progress</div><div class="bar" style="margin:10px 0"><i style="width:30%"></i></div><span class="mu">30% of budget used (sample)</span></div></div>
<div class="card"><h2>Why students run out of money</h2><p class="mu">Pocket money arrives once, bills arrive later, and small daily spends hide the real picture. RupeeWise protects what you owe first, then tells you what is safe to spend each day.</p></div>
<div class="grid">${[['Expense tracking','Log income and spending in seconds.'],['Safe daily limit','(Balance − unpaid essentials) ÷ days left.'],['Smart alerts','Early warnings at 80% and 100% of budget.'],['Rule-based assistant','Ask where your money goes – answers use your data.']].map(x=>`<div class="card"><h3>${x[0]}</h3><span class="mu">${x[1]}</span></div>`).join('')}</div>
<div class="card"><h2>How it works</h2><p class="mu">1. Set your budget → 2. Track expenses → 3. Receive guidance.</p></div>
<div class="card"><h2>Privacy</h2><p class="mu">This demo stores data only in your own browser. No bank credentials are ever requested.</p></div>
<div class="card"><h2>FAQ</h2><details><summary>Is the forecast guaranteed?</summary><p class="mu">No. Forecasts are estimates based on your recent spending.</p></details><details><summary>Do I need a bank account?</summary><p class="mu">No. You enter your own numbers.</p></details></div>
<footer class="mu" style="text-align:center">© RupeeWise · Hackathon demo · contact@example.com (placeholder)</footer>`;
V.dashboard=()=>{if(!S.set)return setup();const c=calc(),g=S.goals[0],sc=score(c),scc=sc>=70?'var(--ac)':sc>=40?'var(--wa)':'var(--er)',mood=sc>=70?'😎 Cruising':sc>=40?'🙂 Careful':sc>=20?'😬 Tight':'🚨 Survival mode';
return`<h1 style="font-size:28px">Hey, ${esc(S.name)}! Let’s make your money last.</h1>${S.demo?'<span class="tag">Demo data – fictional student profile</span>':''}
<div class="grid" style="margin-top:14px"><div class="card"><div class="mu">Available balance</div><div class="big">${fmt(c.avail)}</div></div><div class="card"><div class="mu">Spent this month</div><div class="big">${fmt(c.exp)}</div></div><div class="card"><div class="mu">Safe daily limit</div><div class="big ${c.prot>0?'ac':'er'}">${fmt(c.limit)}</div></div><div class="card"><div class="mu">Savings progress</div><div class="big">${g?Math.min(100,Math.round(g.saved/g.target*100))+'%':'—'}</div></div></div>
<div class="card"><h2>Daily spending calculator</h2><p>${c.prot>0&&c.days>0?`Your recommended daily spending limit is <b class="ac">${fmt(c.limit)}</b>.`:c.days<1?'<span class="wa">Set at least 1 day remaining to get a limit.</span>':'<b class="er">Warning: your protected balance is zero or negative. Avoid flexible spending.</b>'}</p>
<p class="mu">Protected balance = ${fmt(c.avail)} − ${fmt(c.unpaid)} unpaid essentials = <b>${fmt(c.prot)}</b>; ÷ ${c.days} days.${c.prot>0?` You have ${fmt(c.prot)} for flexible spending after your upcoming essentials.`:''}</p>
<form onsubmit="setDays(event)"><div><label>Days remaining</label><input name="d" type="number" min="0" max="366" value="${S.days}"></div><button class="btn s">Recalculate</button></form></div>
<div class="grid g2"><div class="card" style="display:flex;gap:16px;align-items:center"><svg viewBox="0 0 90 90" width="96" role="img" aria-label="Survival score ${sc} out of 100"><circle cx="45" cy="45" r="36" fill="none" stroke="var(--sf)" stroke-width="9"/><circle cx="45" cy="45" r="36" fill="none" stroke="${scc}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${sc*2.262} 226.2" transform="rotate(-90 45 45)"/><text x="45" y="51" text-anchor="middle" font-size="20" font-weight="700" fill="var(--tx)">${sc}</text></svg><div><h2>Survival score</h2><b>${mood}</b><br><span class="mu">How comfortably your money lasts at your current pace. An estimate only.</span></div></div><div class="card"><h2>Can I afford it?</h2><input type="number" min="0" placeholder="Type a price in ₹" oninput="aff(this.value)"><p id="af" class="mu">Type a price to check it against today’s safe limit.</p></div></div>
<div class="card"><h2>Monthly budget</h2><div class="bar"><i style="width:${Math.min(100,c.used)}%;background:${c.used>=100?'var(--er)':c.used>=80?'var(--wa)':'var(--ac)'}"></i></div><p class="mu">${fmt(c.exp)} of ${fmt(S.budget)} (${Math.round(c.used)}%) · Remaining ${fmt(Math.max(0,S.budget-c.exp))}</p></div>
<div class="grid g2"><div class="card"><h2>Spending by category</h2>${donut(c.cat)}</div><div class="card"><h2>Last 7 days</h2>${bars()}</div></div>
<div class="grid g2"><div class="card"><h2>Alerts</h2>${alerts(c).map(a=>`<div class="al ${a[0]}">${a[1]}</div>`).join('')}</div>
<div class="card"><h2>Forecast <span class="tag">estimate, not a guarantee</span></h2>${c.enough?`<p>Average daily spend: <b>${fmt(c.avg)}</b><br>Projected month-end balance: <b class="${c.proj<0?'er':'ac'}">${fmt(c.proj)}</b></p>`:'<p class="mu">Add at least 3 transactions to see a forecast.</p>'}</div></div>
<div class="card"><h2>Upcoming essentials</h2>${S.ess.map(e=>`<div class="row"><span>${esc(e.title)} ${e.due?`<span class="tag">${e.due}</span>`:''}</span><span>${fmt(e.amount)} ${e.paid?'<span class="tag">paid</span>':`<button class="btn sm s" onclick="pay('${e.id}')">Mark paid</button>`} <button class="btn sm s" onclick="delE('${e.id}')">✕</button></span></div>`).join('')||'<p class="mu">None yet.</p>'}
<form onsubmit="addE(event)" style="margin-top:10px"><div><label>Title</label><input name="t" required></div><div><label>Amount ₹</label><input name="a" type="number" min="1" step="0.01" required></div><div><label>Due</label><input name="d" type="date"></div><button class="btn">Add essential</button></form><p class="mu" style="font-size:13px">Marking paid records an expense and removes it from unpaid essentials, so it is never deducted twice.</p></div>
<button class="btn s" onclick="resetAll()">Reset all data</button>`};
function setup(){return`<div class="card"><h2>Welcome to RupeeWise</h2><p class="mu">Set up your month, or explore with clearly labelled fictional data.</p><form onsubmit="doSetup(event)"><div><label>Display name</label><input name="n" required value="${esc((A.list.find(a=>a.id==A.cur)||{}).name||'')}"></div><div><label>Starting balance ₹</label><input name="s" type="number" min="0" step="0.01" required></div><div><label>Monthly budget ₹</label><input name="b" type="number" min="1" required></div><div><label>Days remaining</label><input name="d" type="number" min="1" max="31" value="30" required></div><button class="btn">Start</button></form><p><button class="btn s" onclick="demo()">Load demo data</button></p></div>`}
V.transactions=()=>{if(!S.set)return setup();const f=window.F||{q:'',t:''};const l=S.tx.filter(t=>(!f.t||t.type==f.t)&&(!f.q||(t.desc+t.category).toLowerCase().includes(f.q.toLowerCase()))).sort((a,b)=>b.date.localeCompare(a.date));
return`<div class="card"><h2>Add transaction</h2><form onsubmit="addT(event)"><div><label>Type</label><select name="ty" onchange="catSw(this)"><option>expense</option><option>income</option></select></div><div><label>Amount ₹</label><input name="a" type="number" min="0.01" step="0.01" required></div><div><label>Category</label><select name="c">${CATS.map(x=>`<option>${x}</option>`).join('')}</select></div><div><label>Description</label><input name="d" required></div><div><label>Date</label><input name="dt" type="date" value="${today()}" required></div><button class="btn">Add</button></form></div>
<div class="card"><h2>History</h2><form oninput="filt(this)" style="margin-bottom:8px"><div><label>Search</label><input name="q" value="${esc(f.q)}"></div><div><label>Type</label><select name="t"><option value="">All</option><option ${f.t=='expense'?'selected':''}>expense</option><option ${f.t=='income'?'selected':''}>income</option></select></div><button type="button" class="btn s" onclick="csv()">Export CSV</button></form><div class="tw">${l.map(t=>`<div class="row"><span>${esc(t.desc)} <span class="tag">${esc(t.category)}</span><br><span class="mu" style="font-size:12px">${t.date}</span></span><span class="${t.type=='income'?'ac':''}">${t.type=='income'?'+':'−'}${fmt(t.amount)} <button class="btn sm s" onclick="editT('${t.id}')">Edit</button> <button class="btn sm s" onclick="delT('${t.id}',this)">Delete</button></span></div>`).join('')||'<p class="mu">No transactions match.</p>'}</div></div>`};
V.savings=()=>{if(!S.set)return setup();return`<div class="card"><h2>New savings goal</h2><form onsubmit="addG(event)"><div><label>Goal</label><input name="t" required></div><div><label>Target ₹</label><input name="a" type="number" min="1" required></div><div><label>Saved so far ₹</label><input name="s" type="number" min="0" value="0"></div><div><label>Target date</label><input name="d" type="date"></div><button class="btn">Add goal</button></form></div>
${S.goals.map(g=>{const p=Math.min(100,g.saved/g.target*100),m=g.date?Math.max(1,Math.ceil((new Date(g.date)-Date.now())/2.63e9)):0;return`<div class="card"><div class="row" style="border:0"><h3>${esc(g.title)} ${p>=100?'🎉':''}</h3><button class="btn sm s" onclick="delG('${g.id}')">Delete</button></div><div class="bar"><i style="width:${p}%"></i></div><p class="mu">${fmt(g.saved)} of ${fmt(g.target)} (${Math.round(p)}%) · ${fmt(Math.max(0,g.target-g.saved))} remaining${g.date&&p<100?` · about ${fmt((g.target-g.saved)/m)}/month to reach it by ${g.date}`:''}</p><button class="btn sm" onclick="addSaved('${g.id}',500)">+ ₹500 saved</button> <span class="mu" style="font-size:12px">Only amounts you add here count as savings – income is not auto-saved.</span></div>`}).join('')||'<p class="mu">No goals yet.</p>'}`};
V.budget=()=>{if(!S.set)return setup();const c=calc(),sum=Object.values(S.cb).reduce((a,b)=>a+b,0),pm={};S.tx.filter(t=>t.type=='expense'&&t.date.slice(0,7)<today().slice(0,7)).forEach(t=>pm[t.date.slice(0,7)]=(pm[t.date.slice(0,7)]||0)+t.amount);
return`<div class="card"><h2>Budget planner</h2><p class="mu">The total budget is a spending plan, not extra money. Category limits are parts of the total, so they are never added on top of it.</p><form onsubmit="saveB(event)"><div><label>Total monthly budget ₹</label><input name="tb" type="number" min="1" value="${S.budget}" required></div>${CATS.map((k,i)=>`<div><label>${k} limit ₹</label><input name="c${i}" type="number" min="0" value="${S.cb[k]||''}"></div>`).join('')}<button class="btn">Save budget</button></form>${sum>S.budget?`<div class="al w" style="margin-top:10px">Category limits (${fmt(sum)}) exceed your total budget (${fmt(S.budget)}). Lower some limits.</div>`:`<p class="mu">Unallocated: ${fmt(S.budget-sum)}</p>`}</div>
<div class="card"><h2>Actual vs planned</h2><p>Overall: ${fmt(c.exp)} of ${fmt(S.budget)} (${Math.round(c.used)}%) · Remaining ${fmt(Math.max(0,S.budget-c.exp))}</p>${CATS.filter(k=>S.cb[k]).map(k=>{const l=S.cb[k],sp=c.cat[k]||0,p=sp/l*100;return`<div style="margin:12px 0"><div class="row" style="border:0;padding:0"><b>${k}</b><span>${fmt(sp)} / ${fmt(l)} · ${Math.round(p)}%</span></div><div class="bar"><i style="width:${Math.min(100,p)}%;background:${p>=100?'var(--er)':p>=80?'var(--wa)':'var(--ac)'}"></i></div>${p>=100?`<span class="er">Over by ${fmt(sp-l)} – this overspend takes money from other categories.</span>`:p>=80?'<span class="wa">80% reached – slow down in this category.</span>':`<span class="mu">${fmt(l-sp)} left</span>`}</div>`}).join('')||'<p class="mu">Set category limits above.</p>'}</div>
<div class="card"><h2>Previous months</h2>${Object.entries(pm).sort().reverse().map(([m,v])=>`<div class="row"><span>${m}</span><span>Spent ${fmt(v)}</span></div>`).join('')||'<p class="mu">No earlier months yet.</p>'}</div>`};
V.insights=()=>{if(!S.set)return setup();const R=window.R||{from:'',to:''},l=S.tx.filter(t=>(!R.from||t.date>=R.from)&&(!R.to||t.date<=R.to)),inc=l.filter(t=>t.type=='income').reduce((a,t)=>a+t.amount,0),ex=l.filter(t=>t.type=='expense'),exp=ex.reduce((a,t)=>a+t.amount,0),cat={};ex.forEach(t=>cat[t.category]=(cat[t.category]||0)+t.amount);
const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-1);const pv=d.toISOString().slice(0,7),cu=today().slice(0,7),sm=m=>S.tx.filter(t=>t.type=='expense'&&t.date.slice(0,7)==m).reduce((a,t)=>a+t.amount,0),pe=sm(pv),ce=sm(cu),m=Math.max(inc,exp,1),ts=S.goals.reduce((a,g)=>a+g.saved,0),tt=S.goals.reduce((a,g)=>a+g.target,0);
return`<div class="card"><h2>Insights</h2><form onchange="setR(this)"><div><label>From</label><input name="f" type="date" value="${R.from}"></div><div><label>To</label><input name="t" type="date" value="${R.to}"></div><button type="button" class="btn s" onclick="csv()">Export CSV</button></form></div>
<div class="grid g2"><div class="card"><h2>Income vs expenses</h2><div>Income ${fmt(inc)}<div class="bar"><i style="width:${inc/m*100}%"></i></div></div><div style="margin-top:10px">Expenses ${fmt(exp)}<div class="bar"><i style="width:${exp/m*100}%;background:var(--er)"></i></div></div><p class="mu">Net: ${fmt(inc-exp)}</p></div><div class="card"><h2>Spending by category</h2>${donut(cat)}</div></div>
<div class="grid g2"><div class="card"><h2>Largest categories</h2>${Object.entries(cat).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([k,v])=>`<div style="margin:8px 0">${esc(k)} <b>${fmt(v)}</b><div class="bar"><i style="width:${v/exp*100}%;background:var(--ac2)"></i></div></div>`).join('')||'<p class="mu">No expenses in this range.</p>'}</div><div class="card"><h2>This month vs last month</h2>${pe?`<p>This month ${fmt(ce)} vs last month ${fmt(pe)}: <b class="${ce>pe?'wa':'ac'}">${ce>pe?'up':'down'} ${Math.round(Math.abs(ce-pe)/pe*100)}%</b> (month in progress, so not a full comparison).</p>`:'<p class="mu">No data from last month to compare.</p>'}<h3 style="margin-top:14px">Last 7 days</h3>${bars()}<p class="mu">Savings: ${fmt(ts)} of ${fmt(tt)} across ${S.goals.length} goal(s).</p></div></div>`};
function saveB(e){e.preventDefault();const f=e.target;S.budget=+f.tb.value||0;CATS.forEach((k,i)=>{const v=+f['c'+i].value;if(v>0)S.cb[k]=v;else delete S.cb[k]});save();render();toast('Budget saved')}
function setR(f){window.R={from:f.f.value,to:f.t.value};render()}
function editT(i){const t=S.tx.find(x=>x.id==i);window.E=i;if(location.hash!='#transactions')location.hash='transactions';render();const f=document.querySelector('form[onsubmit="addT(event)"]');f.ty.value=t.type;catSw(f.ty);f.c.value=t.category;f.a.value=t.amount;f.d.value=t.desc;f.dt.value=t.date;f.querySelector('button').textContent='Save changes';f.scrollIntoView()}
V.accounts=()=>`<div class="card"><h2>Accounts</h2><p class="mu">Each account keeps its own balance, transactions and goals on this device. Accounts are protected by a password and live only in this browser. Sign out to switch accounts.</p>${A.list.map(a=>`<div class="row"><span>${esc(a.name)} ${a.id==A.cur?'<span class="tag">active</span>':''}</span><span>${a.id==A.cur?`<button class="btn sm s" onclick="delAcct('${a.id}',this)">Delete</button>`:''}</span></div>`).join('')}</div>
<div class="card"><h2>Add account</h2><form onsubmit="addAcct(event)"><div><label>Account name</label><input name="n" required maxlength="30" placeholder="e.g. Hostel budget"></div><div><label>Password (6+ characters)</label><input name="p" type="password" minlength="6" required></div><button class="btn">Add account</button></form></div>`;
function loadAcct(){try{S=JSON.parse(localStorage.getItem(key()))||fresh()}catch(e){S=fresh()}S.cb=S.cb||{};window.F=null;window.R=null}
function swAcct(i){A.cur=i;saveA();loadAcct();render();toast('Switched to '+A.list.find(a=>a.id==i).name)}
const addAcct=e=>signUp(e);
async function hp(p){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('rw'+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return btoa('rw'+p)}}
function gate(){return`<section class="hero"><h1 style="font-size:34px">Welcome to RupeeWise</h1><p>Create your own account to start. Your money details stay in your account on this device.</p></section>${A.list.length?`<div class="card"><h2>Log in</h2><form onsubmit="logIn(event)"><div><label>Account</label><select name="a">${A.list.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select></div><div><label>Password</label><input name="p" type="password" autocomplete="current-password"></div><button class="btn">Log in</button></form></div>`:''}<div class="card"><h2>Create account</h2><form onsubmit="signUp(event)"><div><label>Your name</label><input name="n" required maxlength="30"></div><div><label>Password (6+ characters)</label><input name="p" type="password" minlength="6" required autocomplete="new-password"></div><button class="btn">Create account</button></form></div>`}
async function logIn(e){e.preventDefault();const f=e.target,a=A.list.find(x=>x.id==f.a.value);if(!a)return;if(a.pin&&await hp(f.p.value)!=a.pin)return toast('Wrong password');A.cur=a.id;saveA();loadAcct();location.hash='dashboard';render();toast('Welcome back, '+a.name)}
async function signUp(e){e.preventDefault();const f=e.target,n=f.n.value.trim(),p=f.p.value;if(!n)return;if(p.length<6)return toast('Password needs 6+ characters');if(A.list.some(a=>a.name.toLowerCase()==n.toLowerCase()))return toast('That name is already taken');const i=id();A.list.push({id:i,name:n,pin:await hp(p)});A.cur=i;saveA();loadAcct();location.hash='dashboard';render();toast('Welcome, '+n)}
function signOut(){A.cur=null;saveA();S=fresh();render()}
function delAcct(i,b){if(!b.dataset.s){b.dataset.s=1;b.textContent='Sure?';return}try{localStorage.removeItem(i=='a0'?'rw':'rw_'+i)}catch(x){}A.list=A.list.filter(a=>a.id!=i);A.cur=null;saveA();loadAcct();render();toast('Account deleted')}
const chat=[{u:0,t:'Hi! I’m RupeeWise AI (rule-based mode). Ask: “Can I afford ₹500 today?”, “Where am I spending the most?”, “How can I save ₹1,000?”, “Why is my limit low?” or “What will I have at month-end?”'}];
V.assistant=()=>`<div class="card"><h2>RupeeWise AI</h2><div class="chat" id="chat">${chat.map(m=>`<div class="m ${m.u?'u':''}">${esc(m.t)}</div>`).join('')}</div><form onsubmit="ask(event)" style="grid-template-columns:1fr auto"><input name="q" placeholder="Ask about your money…" required><button class="btn">Send</button></form><p class="mu" style="font-size:12px">Budgeting guidance based on your entered data, not professional financial advice. No savings are guaranteed.</p></div>`;
function answer(q){if(!S.set)return'I don’t have any data yet. Set up your account or load demo data first.';const c=calc(),l=q.toLowerCase(),n=+(l.match(/(\d[\d,]*)/)||[])[1]?.replace(/,/g,'');
if(/afford|spend ₹?\d/.test(l)&&n)return n<=c.limit?`Yes – ${fmt(n)} is within today’s safe limit of ${fmt(c.limit)}. Reasoning: (balance ${fmt(c.avail)} − unpaid essentials ${fmt(c.unpaid)}) ÷ ${c.days} days.`:`That is above your safe daily limit of ${fmt(c.limit)}. ${n<=c.prot?'It fits in your protected balance but would shrink the days ahead.':'It would also exceed your protected balance, so it would cut into upcoming essentials.'}`;
if(/most|where|categor/.test(l)){const e=Object.entries(c.cat).sort((a,b)=>b[1]-a[1])[0];return e?`Your biggest category is ${e[0]} at ${fmt(e[1])} (${Math.round(e[1]/c.exp*100)}% of ${fmt(c.exp)} spent).`:'No expenses recorded yet, so I can’t say.'}
if(/save/.test(l)){const e=Object.entries(c.cat).filter(x=>['Food','Shopping','Entertainment'].includes(x[0])).sort((a,b)=>b[1]-a[1])[0];return e?`One option: trim ${e[0]} (${fmt(e[1])} so far) by about 15%, roughly ${fmt(e[1]*.15)}. Savings depend on your habits and aren’t guaranteed.`:'I need flexible-category expenses (food, shopping, entertainment) to suggest cuts.'}
if(/limit|low/.test(l))return c.prot<=0?`Your limit is ₹0 because unpaid essentials (${fmt(c.unpaid)}) are as large as your balance (${fmt(c.avail)}).`:`Limit = (${fmt(c.avail)} − ${fmt(c.unpaid)}) ÷ ${c.days} days = ${fmt(c.limit)}. A bigger balance or more days raises it.`;
if(/end|month|forecast|will i have/.test(l))return c.enough?`Estimate (not a guarantee): at ${fmt(c.avg)}/day you may end around ${fmt(c.proj)} after essentials.`:'There isn’t enough data yet (need 3+ transactions) for a meaningful forecast.';
return'I can help with affordability, top categories, saving ideas, your daily limit, and a month-end estimate.'}
/* ---- actions ---- */
function setDays(e){e.preventDefault();S.days=+e.target.d.value||0;save();render();toast('Limit recalculated')}
function doSetup(e){e.preventDefault();const f=e.target;S={...fresh(),set:true,name:f.n.value.trim(),start:+f.s.value,budget:+f.b.value,days:+f.d.value};save();render();toast('All set!')}
function demo(){const d=n=>new Date(Date.now()-n*864e5).toISOString().slice(0,10),t=(c,a,n,x)=>({id:id(),type:'expense',category:c,amount:a,desc:n,date:d(x)});
S={set:true,demo:true,name:'Asha (demo)',start:10000,budget:10000,days:20,tx:[t('Food',900,'Mess & canteen',1),t('Transport',400,'Bus pass',2),t('Groceries',500,'Snacks & supplies',3),t('Entertainment',600,'Movie night',4),t('Shopping',600,'Notebooks & bag',5)],ess:[{id:id(),title:'Hostel Wi‑Fi (demo)',amount:1000,due:d(-5),paid:false}],goals:[{id:id(),title:'Laptop fund (demo)',target:30000,saved:4500,date:''}],cb:{Food:1500,Transport:600,Entertainment:500,Shopping:800}};save();location.hash='dashboard';render();toast('Demo data loaded – fictional profile')}
function resetAll(){S=fresh();save();render();toast('Data cleared')}
function addT(e){e.preventDefault();const f=e.target,a=+f.a.value;if(!(a>0))return toast('Enter a positive amount');const x=window.E&&S.tx.find(t=>t.id==window.E),v={type:f.ty.value,category:f.c.value,amount:a,desc:f.d.value.trim(),date:f.dt.value};x?Object.assign(x,v):S.tx.push({id:id(),...v});window.E=null;save();render();toast(x?'Transaction updated':'Transaction added')}
function catSw(s){s.form.c.innerHTML=(s.value=='income'?INC:CATS).map(x=>`<option>${x}</option>`).join('')}
function delT(i,b){if(!b.dataset.s){b.dataset.s=1;b.textContent='Sure?';return}S.tx=S.tx.filter(t=>t.id!=i);save();render();toast('Deleted')}
function filt(f){window.F={q:f.q.value,t:f.t.value};const p=f.q.selectionStart;render();const q=$('input[name=q]');q.focus();q.setSelectionRange(p,p)}
function addE(e){e.preventDefault();const f=e.target;S.ess.push({id:id(),title:f.t.value.trim(),amount:+f.a.value,due:f.d.value,paid:false});save();render();toast('Essential added')}
function delE(i){S.ess=S.ess.filter(x=>x.id!=i);save();render()}
function pay(i){const x=S.ess.find(e=>e.id==i);x.paid=true;S.tx.push({id:id(),type:'expense',category:'Bills',amount:x.amount,desc:x.title+' (essential)',date:today()});save();render();toast('Paid – recorded once as an expense')}
function addG(e){e.preventDefault();const f=e.target;S.goals.push({id:id(),title:f.t.value.trim(),target:+f.a.value,saved:+f.s.value||0,date:f.d.value});save();render();toast('Goal added')}
function delG(i){S.goals=S.goals.filter(g=>g.id!=i);save();render()}
function addSaved(i,a){const g=S.goals.find(x=>x.id==i);g.saved+=a;save();render();if(g.saved>=g.target&&window.burst)burst(innerWidth/2,innerHeight/3);toast(g.saved>=g.target?'🎉 Goal complete!':'Saved '+fmt(a))}
function csv(){const r=['date,type,category,description,amount',...S.tx.map(t=>[t.date,t.type,t.category,'"'+t.desc.replace(/"/g,'""')+'"',t.amount].join(','))].join('\n');const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(r);a.download='rupeewise.csv';a.click()}
function ask(e){e.preventDefault();const q=e.target.q.value;chat.push({u:1,t:q},{u:0,t:answer(q)});render();const c=$('#chat');c.scrollTop=c.scrollHeight}
function theme(){const r=document.documentElement,d=r.dataset.theme?r.dataset.theme=='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=d?'light':'dark'}
function score(c){if(!S.set)return 0;if(c.prot<=0)return 8;const s=c.enough&&c.avg>0?c.limit/c.avg*66:100-c.used;return Math.round(Math.max(5,Math.min(100,s)))}
function aff(v){const n=+v,c=calc(),e=$('#af');if(!(n>0)){e.textContent='Type a price to check it against today\u2019s safe limit.';return}
e.innerHTML=n<=c.limit?`✅ Yes. It fits today\u2019s safe limit of ${fmt(c.limit)}.`:n<=c.prot&&c.days>1?`🟡 Possible, but over today\u2019s limit. Your limit for the other days would drop to about ${fmt((c.prot-n)/(c.days-1))}.`:n<=c.prot?`🟡 It uses all your flexible money.`:`❌ Not safely. It is more than your protected balance of ${fmt(Math.max(0,c.prot))}.`}
function countUp(){document.querySelectorAll('.big').forEach(e=>{const v=parseFloat(e.textContent.replace(/[₹,]/g,''));if(e.textContent[0]!='₹'||!(v>0)||matchMedia('(prefers-reduced-motion:reduce)').matches)return;const s=performance.now();(function st(n){const p=Math.min(1,(n-s)/700);e.textContent=fmt(v*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(st)})(s)})}
function render(){const h=(location.hash||'#home').slice(1),v=V[h]?h:'home';if(!A.cur){$('#nav').innerHTML='<b>₹ RupeeWise</b>';$('#app').innerHTML=gate();return}$('#nav').innerHTML='<b>₹ RupeeWise</b><span class="tag" style="margin-right:8px">'+esc(A.list.find(a=>a.id==A.cur).name)+'</span>'+Object.keys(V).map(k=>`<a href="#${k}" class="${k==v?'on':''}">${k[0].toUpperCase()+k.slice(1)}</a>`).join('')+'<a href="#" onclick="theme();return false">◐ Theme</a><a href="#" style="margin-left:auto;border:1px solid var(--bd)" onclick="signOut();return false">⎋ Log out</a>';$('#app').innerHTML=V[v]();if(render.v!=v){render.v=v;countUp()}}
/* mint cursor spray */
(()=>{if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
const c=$('#fx'),x=c.getContext('2d');let P=[],W,H,run=0,g={x:0,y:0,tx:0,ty:0,on:0};
const rs=()=>{const d=devicePixelRatio||1;W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0)};rs();addEventListener('resize',rs);
addEventListener('pointermove',e=>{g.tx=e.clientX;g.ty=e.clientY;if(!g.on){g.x=g.tx;g.y=g.ty;g.on=1}
for(let i=0;i<3;i++)P.push({x:e.clientX+(Math.random()-.5)*8,y:e.clientY+(Math.random()-.5)*8,vx:(Math.random()-.5)*1.6,vy:(Math.random()-.5)*1.6+.2,r:1.5+Math.random()*4,l:1,h:150+Math.random()*30});
if(P.length>160)P.splice(0,P.length-160);if(!run){run=1;requestAnimationFrame(f)}});
function f(){x.clearRect(0,0,W,H);g.x+=(g.tx-g.x)*.15;g.y+=(g.ty-g.y)*.15;
const gr=x.createRadialGradient(g.x,g.y,0,g.x,g.y,70);gr.addColorStop(0,'hsla(160,80%,55%,.22)');gr.addColorStop(1,'hsla(160,80%,55%,0)');x.fillStyle=gr;x.fillRect(g.x-70,g.y-70,140,140);
P=P.filter(p=>p.l>0);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vx*=.98;p.l-=.022;x.beginPath();x.fillStyle=`hsla(${p.h},85%,58%,${p.l*.6})`;x.arc(p.x,p.y,p.r*p.l+.5,0,7);x.fill()});
if(P.length||Math.hypot(g.tx-g.x,g.ty-g.y)>1)requestAnimationFrame(f);else{run=0;x.clearRect(0,0,W,H)}}
window.burst=(bx,by)=>{for(let i=0;i<70;i++){const a=Math.random()*6.28,s=2+Math.random()*5;P.push({x:bx,y:by,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,r:2+Math.random()*4,l:1.6,h:Math.random()*360})}if(!run){run=1;requestAnimationFrame(f)}};
})();
addEventListener('hashchange',()=>{window.E=null;render();scrollTo(0,0)});render();
</script></body></html>
